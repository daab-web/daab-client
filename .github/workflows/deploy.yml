name: Deploy to VPS using Docker

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tng1/daab-client
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SERVER=${{ secrets.NEXT_PUBLIC_SERVER }}
            NEXT_PUBLIC_MINIO_HOST=${{ secrets.NEXT_PUBLIC_MINIO_HOST }}
            AUTH_DB_PATH=${{ secrets.AUTH_DB_PATH }}
            DB_PATH=${{ secrets.DB_PATH }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: index.docker.io/tng1/daab-client
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Pull new image and restart application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            docker pull ${{ steps.meta.outputs.tags }}
            docker stop daab-client || true
            docker container rm daab-client || true
            docker run -d --name daab-client -p 80:3000 \
              --restart unless-stopped \
              -e BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }} \
              -e BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }} \
              -v ${{ secrets.VOLUME }} \
              ${{ steps.meta.outputs.tags }}
            docker logout
