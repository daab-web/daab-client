services:
  db-init:
    image: alpine
    command: chown -R 1002:1002 /data
    volumes:
      - ./data/sqlite:/data

  backend:
    image: tng1/daab-server:master
    pull_policy: always
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - 5035:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - .env.local
    volumes:
      - ./data/sqlite:/app/sqlite
